spring.datasource.url=${OTSEC_DATABASE_URL}
spring.datasource.username=${OTSEC_DATABASE_USER}
spring.datasource.password=${OTSEC_DATABASE_PASSWORD}
server.servlet.session.cookie.secure=true
spring.security.oauth2.client.registration.keycloak.client-id=${OTSEC_OIDC_CLIENT_ID}
spring.security.oauth2.client.registration.keycloak.client-secret=${OTSEC_OIDC_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile
spring.security.oauth2.client.provider.keycloak.issuer-uri=${OTSEC_OIDC_ISSUER}
